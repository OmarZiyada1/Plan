<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="خطة 1800">
  <meta name="description" content="خطة غذائية لشهر: 1800 سعرة يوميًّا في وجبتين، مع الوصفات وقائمة التسوق.">
  <title>خطة 1800 سعرة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* الوضع الداكن قبل الرسم الأول حتى لا يومض؛ الفاتح هو الأساس */
    try {
      if (JSON.parse(localStorage.getItem('plan1800.theme')) === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main" data-action="skip">إلى المحتوى</a>

  <header class="top">
    <div class="wrap top__in">
      <a class="brand" href="#/plan" aria-label="خطة 1800 سعرة، إلى الخطة">
        <span class="brand__num">1800</span>
        <span class="brand__txt">سعرة · وجبتان</span>
      </a>
      <div class="top__end">
        <nav class="nav" aria-label="الأقسام">
          <a href="#/plan" data-tab="plan">الخطة</a>
          <a href="#/recipes" data-tab="recipes">الوصفات</a>
          <a href="#/shop" data-tab="shop">التسوق</a>
          <a href="#/info" data-tab="info">معلومات</a>
        </nav>
        <button type="button" class="btn btn--sm" id="theme-btn" data-action="theme-toggle">داكن</button>
      </div>
    </div>
  </header>

  <main id="main" class="wrap main" tabindex="-1">
    <noscript><p>تحتاج هذه الصفحة إلى تفعيل JavaScript.</p></noscript>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
